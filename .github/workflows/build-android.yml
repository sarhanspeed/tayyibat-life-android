name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Name APK using project version
        id: version
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/TayyibatLife-v${VERSION_NAME}-install.apk"
          sha256sum "release-output/TayyibatLife-v${VERSION_NAME}-install.apk" > "release-output/TayyibatLife-v${VERSION_NAME}-install.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TayyibatLife-v${{ steps.version.outputs.name }}-APK
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TayyibatLife-build-diagnostics
          path: |
            build.log
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

