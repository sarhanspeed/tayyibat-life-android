plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (!versionFile.exists()) {
    throw new GradleException('version.properties is missing')
}
versionFile.withInputStream { versionProps.load(it) }

android {
    namespace 'com.tayyibat.life'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tayyibat.life'
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(versionProps.getProperty('VERSION_CODE'))
        versionName versionProps.getProperty('VERSION_NAME')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}
